# Installed by hand to /etc/tmpfiles.d/tmp.conf on basement (BS-28); overrides /usr/lib/tmpfiles.d/tmp.conf.
# /tmp is a 1M-inode tmpfs; the 10d default never fires between reboots.
q /tmp 1777 root root 2d
e /tmp/node-compile-cache - - - 12h
e /tmp/.pnpm-store - - - 3d
x /tmp/bs-*
x /tmp/ac-*
x /tmp/claude-*
x /tmp/review-*
x /tmp/systemd-private-*
x /tmp/tmux-*
x /tmp/ssh-*
x /tmp/.X11-unix
x /tmp/.ICE-unix
x /tmp/.XIM-unix
x /tmp/.font-unix
x /tmp/.X*-lock
x /tmp/sddm-*
x /tmp/xauth*
